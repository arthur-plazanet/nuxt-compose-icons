name: Build Playground and Docs

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: number
        default: 22

permissions:
  contents: read

jobs:
  build-playground:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node_version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Build the module (prepack)
        run: pnpm --filter nuxt-compose-icons prepack

      - name: Prepare playground
        run: pnpm --filter ./packages/nuxt/playground exec nuxi prepare

      - name: Build playground
        run: pnpm --filter ./packages/nuxt/playground exec nuxi build

      - name: Generate playground
        run: pnpm --filter ./packages/nuxt/playground exec nuxi generate

      - name: Upload build artifacts generate
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: playground-static
          path: ./packages/nuxt/playground/.output/public/

      - name: Upload-artifact if will deploy
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: playground-build
          path: ./packages/nuxt/playground/.output/public/

  # The runtime showcase is what the README's StackBlitz button opens, and it resolves
  # nuxt-compose-icons from npm rather than the workspace. Building and testing it here
  # is the only check that exercises the published-package path a visitor actually hits.
  build-showcase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node_version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Build showcase
        run: pnpm showcase:build

      - name: Test showcase
        run: pnpm test:showcase

  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node_version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Build with VitePress
        run: pnpm docs:build

      - name: Upload-artifact if will deploy
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: ./docs/.vitepress/dist/
