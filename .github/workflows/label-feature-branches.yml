name: Label branches by type

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Determine label from branch prefix
        id: branch_label
        run: |
          ref="${{ github.head_ref }}"
          case "$ref" in
            feature/*) label="feature";       color="0e8a16"; description="Branched from feature/*" ;;
            fix/*)     label="bug";           color="d73a4a"; description="Branched from fix/*" ;;
            docs/*)    label="documentation"; color="0075ca"; description="Branched from docs/*" ;;
            *)         label="" ;;
          esac
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"

      - name: Ensure label exists
        if: steps.branch_label.outputs.label != ''
        uses: actions/github-script@v7
        with:
          script: |
            const name = '${{ steps.branch_label.outputs.label }}';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                color: '${{ steps.branch_label.outputs.color }}',
                description: '${{ steps.branch_label.outputs.description }}',
              });
            }

      - name: Apply label
        if: steps.branch_label.outputs.label != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['${{ steps.branch_label.outputs.label }}'],
            });
